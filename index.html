<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centre de Copie Mehdi — Librairie</title>
<meta name="description" content="Centre de Copie - Librairie Mehdi. Vos besoins, notre priorité.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0B3FA8; --blue-deep:#082E7D; --red:#D7102A; --orange:#F7941D; --yellow:#FBB814; --green:#2E9E2E;
  --paper:#FFF9F0; --ink:#12224A; --muted:#5B6785; --line:#F0E2CC;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
.page{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:72px}
@media(min-width:560px){.page{margin:24px auto;border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(215,16,42,.18);min-height:auto}}

.hero{
  padding:22px 18px 56px;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,.28) 0 2px,transparent 3px) 0 0/16px 16px,
    linear-gradient(135deg,var(--yellow) 0%,var(--orange) 35%,var(--red) 100%);
}
.logo-card{background:#fff;border-radius:22px;padding:10px;box-shadow:0 10px 28px rgba(8,46,125,.28)}
.logo-card img{display:block;width:100%;height:auto;border-radius:14px}

.bars{display:flex;height:5px;margin:-3px 24px 0;border-radius:3px;overflow:hidden;position:relative}
.bars i{flex:1}
.bars i:nth-child(1){background:var(--yellow)}.bars i:nth-child(2){background:var(--red)}
.bars i:nth-child(3){background:var(--green)}.bars i:nth-child(4){background:var(--blue)}

.intro{text-align:center;padding:0 24px;margin-top:-30px;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(11,63,168,.35)}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;line-height:1.1;color:var(--blue);margin:14px 0 2px}
.sub{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;color:var(--red)}
.tag{font-style:italic;color:var(--muted);margin-top:6px;font-size:15px}

.services{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px 24px 0}
.services span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid}
.services span:nth-child(1){color:var(--blue);border-color:var(--blue)}
.services span:nth-child(2){color:var(--red);border-color:var(--red)}
.services span:nth-child(3){color:var(--green);border-color:var(--green)}

.actions{display:flex;flex-direction:column;gap:10px;padding:22px 24px 8px}
.abtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;border-radius:14px;font:700 15.5px 'Nunito',sans-serif;color:#fff;text-decoration:none;border:0;cursor:pointer;width:100%;transition:transform .15s,filter .15s}
.abtn:hover{filter:brightness(1.07)}.abtn:active{transform:scale(.98)}
.abtn:focus-visible,.sticky a:focus-visible,.sticky button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.call{background:var(--blue)}
.wa{background:#25D366}
.ig{background:linear-gradient(45deg,#F9CE34,#EE2A7B 45%,#6228D7)}
.fb{background:#1877F2}
.map{background:var(--red)}
.mail{background:var(--orange)}
.save{background:#fff;color:var(--blue);border:2px solid var(--blue)}

.section{padding:18px 24px 6px}
.section h2{font-family:'Baloo 2',sans-serif;font-size:19px;color:var(--blue);margin:0 0 12px;text-align:center}
.info{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px}
.row svg{flex:none;color:var(--red)}
.row small{display:block;color:var(--muted);font-weight:500}

.map-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(11,63,168,.12)}
.map-embed{width:100%;height:320px;border:0;display:block}
.map-info{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--red),var(--orange))}
.map-title{font-weight:700;font-size:15px}
.map-sub{font-size:12.5px;opacity:.92}
.map-info:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.abtn.wifi{background:#00897B}
dialog#wifiDlg{border:0;border-radius:20px;padding:22px;width:min(92vw,360px);text-align:center;color:var(--ink);background:#fff;box-shadow:0 20px 50px rgba(8,46,125,.35)}
dialog#wifiDlg::backdrop{background:rgba(18,34,74,.55)}
#wifiDlg h3{font-family:'Baloo 2',sans-serif;font-size:20px;margin:0 0 4px;color:var(--blue)}
#wifiDlg p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
#wifiQr{width:210px;height:210px;margin:6px auto 12px;padding:8px;border:2px solid var(--line);border-radius:14px;background:#fff}
#wifiQr svg{width:100%;height:100%;display:block}
.wifi-row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:700;font-size:14.5px;word-break:break-all}
.wifi-row small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
#wifiDlg .abtn{margin-top:8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--blue-deep);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.alt{text-align:center;font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:underline;padding:2px 0}
.footer{text-align:center;padding:22px 24px;color:var(--muted);font-size:12.5px}

.sticky{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:3px solid var(--orange);padding-bottom:env(safe-area-inset-bottom,0)}
.sticky a,.sticky button{border:0;background:none;padding:9px 4px;font:700 11.5px 'Nunito',sans-serif;color:var(--blue);text-decoration:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
@media(prefers-reduced-motion:no-preference){.logo-card{animation:pop .6s ease both}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="page" id="page"></main>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),4500);
}
function fold(line){
  const out=[]; while(line.length>74){ out.push(line.slice(0,74)); line=' '+line.slice(74); } out.push(line);
  return out.join('\r\n');
}
function buildVcf(){
  const esc = t => String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const L = [
    'BEGIN:VCARD','VERSION:3.0',
    'N:;'+esc(CONFIG.name)+';;;',
    'FN:'+esc(CONFIG.name),
    'ORG:'+esc(CONFIG.name),
    'TITLE:'+esc(CONFIG.role),
    'TEL;TYPE=CELL,VOICE:'+CONFIG.phone,
    'EMAIL;TYPE=INTERNET,WORK:'+CONFIG.email,
    'ADR;TYPE=WORK:;;'+esc(CONFIG.address)+';;;;',
    'item1.URL:'+CONFIG.mapsUrl,'item1.X-ABLabel:Localisation',
    'item2.URL:'+CONFIG.instagramUrl,'item2.X-ABLabel:Instagram',
    'item3.URL:'+CONFIG.facebookUrl,'item3.X-ABLabel:Facebook',
    'item4.URL:https://wa.me/'+CONFIG.whatsapp,'item4.X-ABLabel:WhatsApp',
    'NOTE:'+esc(CONFIG.tagline+' - '+CONFIG.address)
  ];
  if (CONFIG.photo) L.push('PHOTO;ENCODING=b;TYPE=JPEG:'+CONFIG.photo);
  L.push('END:VCARD');
  return L.map(fold).join('\r\n')+'\r\n';
}
async function saveContact(){
  const vcf = buildVcf();
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const blob = new Blob([vcf],{type:'text/vcard;charset=utf-8'});
  if (isIOS){
    // iPhone : ouvrir directement le fichier => fiche "Créer un nouveau contact"
    window.location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcf);
    return;
  }
  const file = new File([vcf],'Centre-de-Copie-Mehdi.vcf',{type:'text/vcard'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:CONFIG.name}); return; } catch(e){ if(e && e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Centre-de-Copie-Mehdi.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Ouvrez le fichier téléchargé, puis appuyez sur « Enregistrer » dans Contacts');
}
function wifiString(){
  const e=t=>String(t).replace(/([\\;,:"])/g,'\\$1');
  const w=CONFIG.wifi;
  return 'WIFI:T:'+(w.password?w.security:'nopass')+';S:'+e(w.ssid)+';'+(w.password?'P:'+e(w.password)+';':'')+';';
}
function openWifi(){
  const qr=qrcode(0,'M'); qr.addData(wifiString()); qr.make();
  document.getElementById('wifiQr').innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});
  document.getElementById('wifiDlg').showModal();
}
async function copyWifi(){
  try{ await navigator.clipboard.writeText(CONFIG.wifi.password); toast('Mot de passe copié. Ouvrez Réglages > Wi-Fi et collez-le'); }
  catch(e){ toast('Mot de passe : '+CONFIG.wifi.password); }
}

  <div class="actions">
    <a class="abtn call" href="tel:${CONFIG.phone}">${I.phone} Appeler</a>
    <a class="abtn wa" href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">${I.wa} WhatsApp</a>
    <a class="abtn map" href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">${I.pin} Localisation</a>
    <a class="abtn ig" href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">${I.ig} Instagram</a>
    <a class="abtn fb" href="${CONFIG.facebookUrl}" target="_blank" rel="noopener">${I.fb} Facebook</a>
    <button class="abtn wifi" onclick="openWifi()">${I.wifi} Connexion Wi-Fi</button>
    <a class="abtn mail" href="mailto:${CONFIG.email}">${I.mail} E-mail</a>
    <button class="abtn save" onclick="saveContact()">${I.plus} Enregistrer le contact</button>
    <a class="alt" href="contact.vcf">Le contact ne s’ouvre pas ? Appuyez ici</a>
  </div>

  <section class="section">
    <h2>Nous contacter</h2>
    <div class="info">
      <a class="row" href="tel:${CONFIG.phone}">${I.phone}<span>${CONFIG.phoneDisplay}</span></a>
      <a class="row" href="mailto:${CONFIG.email}">${I.mail}<span>${CONFIG.email}</span></a>
      <a class="row" href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">${I.pin}<span>${CONFIG.address}<small>Voir sur la carte</small></span></a>
      <div class="row">${I.clock}<span>${CONFIG.hours}</span></div>
    </div>
  </section>
  <section class="section">
    <h2>Localisation</h2>
    <div class="map-card">
      <iframe class="map-embed" title="Carte" src="https://www.google.com/maps?q=${encodeURIComponent(CONFIG.mapsQuery)}&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <a class="map-info" href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">
        <div><div class="map-title">${CONFIG.address}</div><div class="map-sub">Ouvrir dans Google Maps</div></div>
        ${I.pin}
      </a>
    </div>
  </section>

  <div class="footer">${CONFIG.name} · ${CONFIG.tagline}</div>

  <dialog id="wifiDlg">
    <h3>Wi-Fi gratuit</h3>
    <p>Scannez le QR code avec l’appareil photo d’un autre téléphone, ou copiez le mot de passe.</p>
    <div id="wifiQr"></div>
    <div class="wifi-row"><small>Réseau</small>${CONFIG.wifi.ssid}</div>
    <div class="wifi-row"><small>Mot de passe</small>${CONFIG.wifi.password}</div>
    <button class="abtn call" onclick="copyWifi()">Copier le mot de passe</button>
    <button class="abtn save" onclick="document.getElementById('wifiDlg').close()">Fermer</button>
  </dialog>

  <nav class="sticky">
    <a href="tel:${CONFIG.phone}">${I.phone}Appeler</a>
    <a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">${I.wa}WhatsApp</a>
    <a href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">${I.pin}Localisation</a>
  </nav>`;
</script>
</body>
</html>
